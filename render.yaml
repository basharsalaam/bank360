services:
  # Public landing page
  - type: web
    name: bank360-landing
    rootDir: bank360-frontend/landing
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://bank360-api.onrender.com/api/
      - key: REACT_APP_MONO_PUBLIC_KEY
        value: test_pk_ys5zw74pmxxe8v1ojoyk

  # Authenticated app
  - type: web
    name: bank360-frontend
    rootDir: bank360-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://bank360-api.onrender.com/api/
      - key: REACT_APP_MONO_PUBLIC_KEY
        value: test_pk_ys5zw74pmxxe8v1ojoyk

  # Backend Web Service
  - type: web
    name: bank360-api
    rootDir: bank360-backend-master/Cashflow_Backend-master
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn cashflow.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: db_HOST
        fromDatabase:
          name: bank360-db
          property: host
      - key: db
        fromDatabase:
          name: bank360-db
          property: database
      - key: db_USER
        fromDatabase:
          name: bank360-db
          property: user
      - key: db_PASSWORD
        fromDatabase:
          name: bank360-db
          property: password
      - key: MONO_SEC_KEY
        value: test_sk_c4kmpkwyx37p288mobe9
      - key: MONO_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.bank360.ng,https://bank360.ng,https://www.bank360.ng
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bank360-redis
          property: connectionString

  # Celery Worker
  - type: worker
    name: bank360-worker
    rootDir: bank360-backend-master/Cashflow_Backend-master
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A cashflow worker --pool threads -l INFO
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: db_HOST
        fromDatabase:
          name: bank360-db
          property: host
      - key: db
        fromDatabase:
          name: bank360-db
          property: database
      - key: db_USER
        fromDatabase:
          name: bank360-db
          property: user
      - key: db_PASSWORD
        fromDatabase:
          name: bank360-db
          property: password
      - key: MONO_SEC_KEY
        value: test_sk_c4kmpkwyx37p288mobe9
      - key: PUBLIC_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bank360-redis
          property: connectionString

  # Celery broker for webhook and transaction ingestion jobs
  - type: keyvalue
    name: bank360-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: bank360-db
    plan: free
