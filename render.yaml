services:
  # Backend Web Service
  - type: web
    name: bank360-api
    rootDir: bank360-backend-master/Cashflow_Backend-master
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn cashflow.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: db_HOST
        fromDatabase:
          name: bank360-db
          property: host
      - key: db
        fromDatabase:
          name: bank360-db
          property: database
      - key: db_USER
        fromDatabase:
          name: bank360-db
          property: user
      - key: db_PASSWORD
        fromDatabase:
          name: bank360-db
          property: password
      - key: MONO_SEC_KEY
        value: test_sk_c4kmpkwyx37p288mobe9
      - key: MONO_WEBKOOK_SECRET
        generateValue: true
      - key: PUBLIC_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bank360.ng

  # Celery Worker
  - type: worker
    name: bank360-worker
    rootDir: bank360-backend-master/Cashflow_Backend-master
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A cashflow worker --pool threads -l INFO
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: db_HOST
        fromDatabase:
          name: bank360-db
          property: host
      - key: db
        fromDatabase:
          name: bank360-db
          property: database
      - key: db_USER
        fromDatabase:
          name: bank360-db
          property: user
      - key: db_PASSWORD
        fromDatabase:
          name: bank360-db
          property: password
      - key: MONO_SEC_KEY
        value: test_sk_c4kmpkwyx37p288mobe9
      - key: MONO_WEBKOOK_SECRET
        sync: false
      - key: PUBLIC_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

databases:
  - name: bank360-db
    plan: free
