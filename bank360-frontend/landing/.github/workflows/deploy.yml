name: Deploy React App to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Deploy via SSH
        env:
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_PATH: ${{ secrets.CPANEL_REMOTE_PATH }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          rsync -avz --delete ./build/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH
